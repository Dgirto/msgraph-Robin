[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msgraph-client"
version = "0.1.0"
description = "Librería para integración con Microsoft Graph API"
requires-python = ">=3.9"
dependencies = [
    "msal>=1.24.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["msgraph_client*"]